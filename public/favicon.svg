<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ONE·WAY">
  <style>
    .mark { stroke: #c8461a; }
    .dot  { fill: #16150f; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #ff6a38; }
      .dot  { fill: #edeae1; }
    }
  </style>
  <!-- one-way: a single directed stroke -->
  <g class="mark" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 16 H24" />
    <path d="M17 8.5 L25.5 16 L17 23.5" />
  </g>
  <circle class="dot" cx="6" cy="16" r="2.4" stroke="none" />
</svg>
