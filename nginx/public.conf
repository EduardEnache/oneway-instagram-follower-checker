# ONE·WAY — nginx config for the PUBLIC variant ONLY.
#
# Mounted over /etc/nginx/conf.d/default.conf by docker-compose.public.yml.
# The canonical self-hosted image never sees this file.
#
# It is a deliberate fork of nginx/default.conf. Audit with:
#     diff nginx/default.conf nginx/public.conf
# The ONLY intended deltas are:
#   1. Relaxed CSP (connect-src is no longer 'none'). See below.
#   2. sub_filter injects the public-only telemetry scripts into <head>.
#   3. A same-origin /__e event beacon that returns 204 and logs to stdout.
#   4. /src/tests/ returns 404 (the test runner is not a public endpoint).
#
# If you are deploying ONE·WAY for yourself, you want default.conf, not this.

# Don't advertise the nginx version in Server: headers or error pages.
server_tokens off;

# Serve ES modules with a JavaScript content-type. A wrong type (e.g. text/plain
# or application/octet-stream) makes the browser silently refuse
# `<script type="module">`. nginx 1.27's bundled mime.types already maps `.js`
# to `application/javascript`; it does NOT map `.mjs`, so add just that one.
# (This block merges with the earlier `include mime.types;` in the same http
# context — it does not replace the map.)
types {
    application/javascript  mjs;
}

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_types
    application/javascript
    text/css
    application/json
    image/svg+xml
    font/woff2
    text/plain;

# Cache-Control by path. No file in this app is content-hashed, so TTLs stay
# short — a long TTL just makes redeploys look broken ("still the old build?").
# index.html (and "/", which serves it) must always revalidate.
map $uri $ow_cache_control {
    default        "public, max-age=3600";
    "/"            "no-cache";
    "/index.html"  "no-cache";
}

# Flood-protect the event beacon. Everything arrives from the one cloudflared
# IP, so this rate-limits globally (exactly what we want against log spam).
limit_req_zone $binary_remote_addr zone=ow_events:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Headers on every response ---------------------------------------
    # These are set once here and inherit into every location below, because no
    # location uses its own add_header (nginx add_header does NOT merge with an
    # inherited set once a block declares one of its own).
    #
    # connect-src 'none' is the load-bearing privacy guarantee: the browser
    # itself then blocks every outbound call the page could make — fetch, XHR,
    # WebSocket, sendBeacon — so a data export can't be exfiltrated even if the
    # page tried. script-src stays strict 'self' (the theme init is a real
    # external file, theme-init.js, never inline). style-src allows
    # 'unsafe-inline' only for small inline style attributes.
    # TODO(user): replace SENTRY_INGEST_HOST_PLACEHOLDER with the literal host from your Sentry DSN,
    #   e.g. https://o4509XXXXXXXXX.ingest.us.sentry.io  (US org) or ...ingest.de.sentry.io (EU org).
    #   It is fixed at Sentry org-creation time. Read it from the DSN; do not guess the region.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com SENTRY_INGEST_HOST_PLACEHOLDER; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control $ow_cache_control always;

    # ---- Public-variant script injection ---------------------------------
    # Injected at the container edge so public/index.html stays the single
    # source of truth and the canonical image is byte-identical. Classic
    # (non-module) scripts in <head> run synchronously and in order, so
    # telemetry.js registers its listener before the deferred
    # <script type="module" src="/src/main.js"> at the end of <body> boots.
    sub_filter '</head>' '<link rel="stylesheet" href="/public-extras/public.css"><script src="/public-extras/config.js"></script><script src="/public-extras/sentry.min.js"></script><script src="/public-extras/telemetry.js"></script></head>';
    sub_filter_once on;

    # ---- Routing --------------------------------------------------------
    # The app uses a hash router (#/dashboard), so deep links already resolve
    # client-side. try_files falling back to /index.html is belt-and-suspenders
    # for any non-hash path someone might bookmark or reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The in-browser test runner is not a public endpoint. It would also get
    # the telemetry injection, polluting Sentry with test-harness errors.
    location ^~ /src/tests/ { return 404; }

    # ---- Custom event beacon (public variant only) ----------------------
    # navigator.sendBeacon('/__e?n=<event>&...') -> 204. The request line
    # lands in nginx's stdout access log, which promtail already ships to
    # Loki as container="oneway". No body is read, nothing is stored, and
    # behind the tunnel the client address is always the cloudflared
    # container, so no visitor IP is ever written down.
    location = /__e {
        limit_except GET POST { deny all; }
        limit_req zone=ow_events burst=20 nodelay;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ---- Hardening ---------------------------------------------------------
    # Deny dotfiles (.git, .env, .htaccess, ...). The pattern needs a dot right
    # after a slash, so it never touches /src/, /styles/, /assets/, etc.
    location ~ /\. {
        deny all;
        return 404;
    }
}
