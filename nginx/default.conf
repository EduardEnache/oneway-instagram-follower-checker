# ONE·WAY — nginx server config.
# Serves a zero-build static site. No upstreams, no proxying, no runtime state.
#
# This file is included from the stock nginx.conf's `http { ... }` block, AFTER
# `include /etc/nginx/mime.types;`. So the `types` block below MERGES with the
# default MIME map and only overrides the `js`/`mjs` entries.

# Don't advertise the nginx version in Server: headers or error pages.
server_tokens off;

# Serve ES modules with a JavaScript content-type. A wrong type (e.g. text/plain
# or application/octet-stream) makes the browser silently refuse
# `<script type="module">`. nginx 1.27's bundled mime.types already maps `.js`
# to `application/javascript`; it does NOT map `.mjs`, so add just that one.
# (This block merges with the earlier `include mime.types;` in the same http
# context — it does not replace the map.)
types {
    application/javascript  mjs;
}

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_types
    application/javascript
    text/css
    application/json
    image/svg+xml
    font/woff2
    text/plain;

# Cache-Control by path. No file in this app is content-hashed, so TTLs stay
# short — a long TTL just makes redeploys look broken ("still the old build?").
# index.html (and "/", which serves it) must always revalidate.
map $uri $ow_cache_control {
    default        "public, max-age=3600";
    "/"            "no-cache";
    "/index.html"  "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Headers on every response ---------------------------------------
    # These are set once here and inherit into every location below, because no
    # location uses its own add_header (nginx add_header does NOT merge with an
    # inherited set once a block declares one of its own).
    #
    # connect-src 'none' is the load-bearing privacy guarantee: the browser
    # itself then blocks every outbound call the page could make — fetch, XHR,
    # WebSocket, sendBeacon — so a data export can't be exfiltrated even if the
    # page tried. script-src stays strict 'self' (the theme init is a real
    # external file, theme-init.js, never inline). style-src allows
    # 'unsafe-inline' only for small inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control $ow_cache_control always;

    # ---- Routing --------------------------------------------------------
    # The app uses a hash router (#/dashboard), so deep links already resolve
    # client-side. try_files falling back to /index.html is belt-and-suspenders
    # for any non-hash path someone might bookmark or reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The in-browser test page must stay reachable — do not block /src/.
    # (No special handling needed; the default location serves it. Listed here
    # only as a reminder that /src/tests/index.html and harness.js are public.)

    # ---- Hardening ---------------------------------------------------------
    # Deny dotfiles (.git, .env, .htaccess, ...). The pattern needs a dot right
    # after a slash, so it never touches /src/, /styles/, /assets/, etc.
    location ~ /\. {
        deny all;
        return 404;
    }
}
